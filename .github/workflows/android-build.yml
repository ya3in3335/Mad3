name: Android Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@v4

  build:
    name: Compile, test, lint and build debug APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default ("tools") no longer exists in the SDK repository.
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate locked dependencies
        id: deps
        # Fails if the resolved runtime classpath differs from app/gradle.lockfile.
        run: ./gradlew --stacktrace :app:verifyDependencyLocks

      - name: Compile Kotlin
        id: compile
        run: ./gradlew --stacktrace compileDebugKotlin compileDebugUnitTestKotlin

      - name: Run unit tests
        id: tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Run Android Lint
        id: lint
        run: ./gradlew --stacktrace lintDebug

      - name: Build debug APK
        id: assemble
        run: ./gradlew --stacktrace assembleDebug

      - name: Verify APK exists
        id: apk
        run: |
          APK="app/build/outputs/apk/debug/SAMTEX-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK not found at $APK"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/SAMTEX-debug.apk
          echo "size=$(stat -c%s dist/SAMTEX-debug.apk)" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksum
        id: checksum
        working-directory: dist
        run: |
          sha256sum SAMTEX-debug.apk > SAMTEX-debug.apk.sha256
          cat SAMTEX-debug.apk.sha256
          echo "sha256=$(cut -d' ' -f1 SAMTEX-debug.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAMTEX-Android-APK
          path: |
            dist/SAMTEX-debug.apk
            dist/SAMTEX-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAMTEX-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report failures
        if: failure()
        run: |
          {
            echo "## ❌ SAMTEX build failed"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Dependency lock validation | ${{ steps.deps.outcome }} |"
            echo "| Kotlin compilation | ${{ steps.compile.outcome }} |"
            echo "| Unit tests | ${{ steps.tests.outcome }} |"
            echo "| Android Lint | ${{ steps.lint.outcome }} |"
            echo "| Debug APK | ${{ steps.assemble.outcome }} |"
            echo ""
            echo "Download the **SAMTEX-reports** artifact for the HTML test and lint reports."
          } >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            grep -o 'testcase name="[^"]*" classname="[^"]*"[^>]*>[[:space:]]*<failure message="[^"]*' "$f" \
              | sed -E 's/testcase name="([^"]*)" classname="([^"]*)".*message="(.*)/::error title=Test failed::\2.\1 — \3/' || true
          done

      - name: Build summary
        if: success()
        run: |
          {
            echo "## ✅ SAMTEX build"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| APK | \`SAMTEX-debug.apk\` (debug-signed, **not a production release**) |"
            echo "| Size | ${{ steps.apk.outputs.size }} bytes |"
            echo "| SHA-256 | \`${{ steps.checksum.outputs.sha256 }}\` |"
            echo "| Artifact | \`SAMTEX-Android-APK\` |"
            echo ""
            echo "Unit tests use simulated NFC transports and a simulated ICAO chip; they do not prove compatibility with physical cards."
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-audit:
    name: Dependency vulnerability scan (OSV)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_VERSION: v2.6.0
      OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OSV-Scanner (pinned and checksum-verified)
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check
          chmod +x osv-scanner

      - name: Scan locked runtime dependencies
        run: |
          set -o pipefail
          ./osv-scanner scan source --lockfile app/gradle.lockfile | tee osv-report.txt
          {
            echo "## Dependency vulnerability scan"
            echo '```'
            tail -n 40 osv-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Signed release APK (only when signing secrets exist)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.SAMTEX_KEYSTORE_BASE64 != '' && secrets.SAMTEX_KEYSTORE_PASSWORD != '' && secrets.SAMTEX_KEY_ALIAS != '' && secrets.SAMTEX_KEY_PASSWORD != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_SIGNING != 'true'
        run: echo "No release signing secrets configured – release APK is not built. Only the debug APK is available."

      - name: Checkout
        if: env.HAS_SIGNING == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: env.HAS_SIGNING == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: env.HAS_SIGNING == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - name: Set up Gradle
        if: env.HAS_SIGNING == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        env:
          SAMTEX_KEYSTORE_PASSWORD: ${{ secrets.SAMTEX_KEYSTORE_PASSWORD }}
          SAMTEX_KEY_ALIAS: ${{ secrets.SAMTEX_KEY_ALIAS }}
          SAMTEX_KEY_PASSWORD: ${{ secrets.SAMTEX_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.SAMTEX_KEYSTORE_BASE64 }}
        run: |
          export SAMTEX_KEYSTORE_PATH="$RUNNER_TEMP/samtex-release.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$SAMTEX_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew --stacktrace assembleRelease
          rm -f "$SAMTEX_KEYSTORE_PATH"
          mkdir -p dist
          cp app/build/outputs/apk/release/SAMTEX-release.apk dist/
          (cd dist && sha256sum SAMTEX-release.apk > SAMTEX-release.apk.sha256 && cat SAMTEX-release.apk.sha256)

      - name: Upload signed release APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SAMTEX-Android-Release-APK
          path: dist/
          if-no-files-found: error
